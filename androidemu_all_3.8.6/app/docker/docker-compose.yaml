name: androidemu

services:
  redroid:
    # 【2.0.17】镜像名直接使用国内免注册加速源前缀：实测本机 Docker 的 registry-mirrors 机制
    # 对「官方名」不生效（仍直连 registry-1.docker.io 并超时），而带加速源前缀的拉取是通的；
    # 官方名由 scripts/pull_image.sh 作为别名一并打上，便于排障、回退与卸载清理。
    image: docker.fnnas.com/redroid/redroid:12.0.0-latest
    pull_policy: missing
    container_name: androidemu-android
    restart: unless-stopped
    tty: true
    stdin_open: true
    # 【特权模式必要性声明 — 供应用商店审核与本机排查】
    # 本服务为安卓主容器（redroid / Android 12），是整包唯一以 privileged 运行的容器：
    #   1) redroid 上游（remote-android/redroid-doc）官方部署方式即要求 --privileged：
    #      容器内需访问/挂载内核 binder（binderfs）设备并完成 Android 用户态初始化；
    #   2) 非特权替代方案（device_cgroup_rule / 挂载 binderfs / cap-add=ALL /
    #      seccomp=unconfined）在 v1.0.30 实测容器 ExitCode 0 静默退出、无法开机，
    #      社区同样诉求见 redroid-doc issue #591（仍为开放议题），故 v1.0.31 起恢复；
    #   3) 该特权仅作用于容器内部（容器内 root = Android 系统自身初始化所需），
    #      容器编排仍由 fnOS Docker（docker-project）以常规方式拉起；应用本体
    #      run-as=package、不申请宿主 root；webrtc 云手机画面服务保持非特权运行。
    # 影响面控制：安卓数据卷隔离（androidemu-data）、宿主仅 :ro 挂载 DRI 驱动目录、
    # 无宿主用户目录挂载、卸载自动清理本应用容器/镜像/网络/数据卷、
    # GPU 修复脚本幂等且无 /dev/dri 时自动跳过（详见包内《权限说明》）。
    privileged: true
    stop_grace_period: 60s
    stop_signal: SIGTERM
    # 3.8.6：可选资源限制（默认注释，用户可根据NAS性能自行启用）
    # 启用后可防止安卓容器占用过多CPU/内存影响NAS其他服务
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4.0'      # 最多使用4核
    #       memory: 4G       # 最多使用4GB内存
    # devices 为 x86 标准形态。安装/升级脚本会按宿主实际条件自动裁剪：
    #   · 无 /dev/dri（或 ARM 首版软件渲染）→ 删除 /dev/dri 直通；
    #   · 内核内置 binderfs、宿主无 /dev/binder 静态节点（常见于 ARM）
    #     → 删除 /dev/binder 直通，由 privileged 容器内自建 binderfs。
    # 保留宿主不存在的设备直通会导致 docker compose up 直接创建失败，故必须裁剪。
    # 【2.0.21 关键修复：容器内访问宿主的稳定地址】
    # fnOS 实测：bridge 容器访问「宿主局域网 IP」与 127.0.0.1 都不通，只有「网桥网关」
    # （如 172.19.0.1）通。穿云投屏的云手机 Agent 需要在安卓容器内连宿主的信令(8443)
    # 与 TURN(3478)，用局域网 IP 填必然报 "connect: network is unreachable"，设备永不上线。
    # 注意（2.0.26 实测）：Android 启动时会重写容器内 /etc/hosts，extra_hosts 注入的条目在
    # redroid 里会消失；因此 agent 实际使用「容器自己的网桥网关」（脚本自动探测），这里保留仅为兼容其它形态。
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "androidemu-host:host-gateway"
    devices:
      - /dev/binder
    # 【2.0.8】ADB 端口不再由 Docker 发布：fnOS 的 Docker 没有宿主回环（hairpin）能力，
    # 发布后只有 127.0.0.1 可连、局域网 IP 从 NAS 本机/容器内必然超时（内核亦缺
    # iptables REDIRECT 模块）。改由宿主 scripts/redroid_adb_forward.sh 用 socat
    # 监听 0.0.0.0:5556 → 本容器 adb:5555，使 127.0.0.1 与局域网 IP 都能直连。
    volumes:
      - androidemu-data:/data
      # 宿主 Mesa DRI 驱动目录（模板默认 x86_64 路径）；安装/升级脚本会按宿主
      # 实际架构（x86_64 / aarch64 / armhf）自动探测并校正该路径，
      # 不具备 GPU 直通条件（含 ARM 首版软件渲染）时整行移除。
    command:
      # 不具备 GPU 直通条件的机器及 ARM 首版，安装脚本会自动移除本行回退软件渲染
      # （swiftshader）保证稳定开机；guest 帧率 GPU 直通 60fps、软件渲染回退 30。
      # 3.8.6：帧率从30提升到60，提升流畅度和触摸响应速度
      - androidboot.redroid_fps=60
      - androidboot.redroid_gpu_mode=guest
      # 3.8.3 VAAPI硬件编码由 tune_compose.sh 动态检测后添加：
      # 仅当宿主 GPU 真正支持 VAAPI 编码（vainfo 含 EncSlice/EncPicture）时，
      # 才注入 androidboot.use_redroid_vaapi=1 + androidboot.use_redroid_omx=1；
      # 不支持的机器保持默认 OMX.google.h264.encoder 软件编码，避免黑屏。
      # 3.3.5 默认简体中文 + 中国标准时间（CST/Asia/Shanghai）
      - androidboot.persist.sys.language=zh
      - androidboot.persist.sys.country=CN
      - androidboot.persist.sys.timezone=Asia/Shanghai
      # 3.3.6 关闭串口控制台（减少性能损耗）+ 默认关闭蓝牙（容器无蓝牙硬件）
      # 3.6.1 确认：console=0 安全可用；use_memfd=1 会导致系统服务崩溃，已永久移除
      - androidboot.console=0
      - androidboot.persist.bluetooth.enable=false
      # 3.8.6 性能优化：禁用 NFC（容器无NFC硬件）、禁用系统更新、减少系统服务开销
      - androidboot.persist.sys.nfc.enable=false
      - androidboot.persist.sys.ota.disable=1
      # 3.8.6 默认分辨率 720x1440（9:18 全面屏比例），安装向导可分别设置三端分辨率，
      # 也可安装后手动修改 compose 中这两个值后重启容器（详见 README FAQ）。
      # 分辨率比例与设备屏幕一致时可实现沉浸式真全屏（无黑边）。
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1440

  webrtc:
    image: docker.fnnas.com/buutuu/scrcpy-over-webrtc:latest
    pull_policy: missing
    container_name: androidemu-webrtc
    restart: unless-stopped
    # 去特权化（v1.0.26）：webrtc 仅运行 coturn 中转与 WebRTC signaling，无需特权模式
    stop_grace_period: 30s
    # 【2.0.9 关键修复：改用 host 网络】
    # 目的：让云手机画面服务（含其内部的设备连接逻辑）能直接用 <局域网IP> 访问宿主端口。
    # 原因：fnOS 会拦截「bridge 容器 → 宿主局域网 IP」的访问，bridge 模式下云手机后台
    #   用 192.168.1.x:5556 添加本机模拟器必然连接超时（连 127.0.0.1:5556 也不可达）。
    # host 网络下：127.0.0.1:5556（宿主 socat 转发）、<局域网IP>:5556、以及画面服务自身的
    #   https://<局域网IP>:8443 都能直连；上游镜像本身即按 host 网络部署设计。
    # 容器仍不使用 privileged；监听端口与原先端口映射完全一致（8443 TCP、3478 TCP/UDP、
    #   50000-50100 UDP），不新增任何端口。ADB 5556 由宿主 socat 转发提供（见 scripts/redroid_adb_forward.sh）。
    network_mode: host
    # 3.5.8 性能优化：允许设置负 nice 值（提升 webrtc/turn 进程优先级，减少调度延迟）
    # CAP_SYS_NICE 仅影响进程调度优先级，不涉及设备/网络/文件系统访问
    cap_add:
      - SYS_NICE
    # 3.3.8 自定义 entrypoint：原 entrypoint.sh 生成的 turnserver.conf 不含 listening-ip，
    # 导致 coturn 只监听 docker 网桥（172.19.0.1），局域网/外网都无法连接 TURN。
    # 挂载定制版 entrypoint，在生成配置时就包含 listening-ip=0.0.0.0。
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    environment:
      - PUBLIC_IP=${ANDROIDEMU_HOST_IP:-127.0.0.1}
      # 3.5.6：直接在 compose 中设置 ICE_SERVERS，避免 entrypoint 中 su 降权导致环境变量丢失
      - ICE_SERVERS=turn:cloudphone_user:cloudphone_secure_password@${ANDROIDEMU_HOST_IP:-127.0.0.1}:3478?transport=udp,turn:cloudphone_user:cloudphone_secure_password@${ANDROIDEMU_HOST_IP:-127.0.0.1}:3478?transport=tcp,stun:${ANDROIDEMU_HOST_IP:-127.0.0.1}:3478
      # 3.8.6：帧率提升到60fps，编码长边1280，优化码率范围，提升流畅度和触摸响应
      # 单引号包裹是 YAML 语法，实际传入环境变量的值为合法 JSON。
      - DEFAULT_SETTINGS='{"maxBitrate":12,"minBitrate":4,"fps":60,"size":1280,"bitrate":16,"audio":true,"stayAwake":true,"powerOff":false}'
    volumes:
      # v1.0.10 起持久化穿云投屏数据（admin 账号、设备绑定等），容器重建后不再丢失
      - androidemu-webrtc-data:/app/data
      # 3.3.8 自定义 entrypoint（修复 TURN 监听地址）
      - ./entrypoint_custom.sh:/custom-entrypoint.sh:ro

volumes:
  androidemu-data:
    name: androidemu-data
  androidemu-webrtc-data:
    name: androidemu-webrtc-data

networks:
  default:
    name: androidemu_default
