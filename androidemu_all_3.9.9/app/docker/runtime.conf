# androidemu 运行时版本配置 —— 单一可信源（single source of truth）
#
# 【本文件是「用哪个 Android 版本 / 哪个上游镜像」的唯一配置点】
#   · 换 Android 版本：只改 ANDROID_VER（9~16 任选），镜像名按 redroid 官方命名自动拼出；
#   · 换镜像源/标签：只改下面的 REPO / TAG；
#   · 所有脚本（pull_image / start_pull_bg / tune_compose / agent 提取 /
#     install·upgrade·uninstall 回调）都从这里取值 —— **禁止在别处写死版本号**。
#
# 【设计原则（务必遵守）】
#   1) 不针对单个版本打补丁：本文件只做「取值」，不含任何 if 分支，新增版本不需要改代码；
#   2) 版本相关能力（GMS 载体包、houdini 翻译层、音频 Codec2 等）一律由各自脚本用
#      **能力探测**（容器内探测文件/属性）决定启停，不按版本号硬编码；
#   3) 默认值与历史行为完全一致（Android 12 / redroid:12.0.0-latest / 穿云投屏 latest），
#      即：不配置时行为不变，升级本应用不会改变现有部署。
#   4) 需要临时覆盖时用环境变量（ANDROIDEMU_* / GMS_IMAGE_BASE），不要改本文件的默认值。

# ── Android 版本（9 ~ 16）──
ANDROID_VER="${ANDROIDEMU_ANDROID_VER:-12}"

# ── 安卓容器（redroid）镜像 ──
REDROID_REPO="${ANDROIDEMU_REDROID_REPO:-redroid/redroid}"
REDROID_TAG="${ANDROIDEMU_REDROID_TAG:-${ANDROID_VER}.0.0-latest}"

# ── 穿云投屏（ScrcpyOverWebRTC）镜像：随包按 digest 锁定 ──
# 上游只发布 :latest 浮动标签（无版本 tag），若直接跟随，上游一推送新镜像，
# 用户容器就会跑上未经本应用测试的版本（配置与镜像错配、行为突变）。
# 因此按 manifest digest 锁定：装上的永远是发布本包时实测过的那个镜像；
# 上游更新 latest 对已装用户零影响。上游有更新时，换新 digest 随新版应用包发布。
# 【digest 不会因上游更新而拉不到】digest 指向镜像内容本身而非标签，Hub 保留历史
# manifest，标签挪走后仍可按 digest 精确拉取（2026-10-18 NAS 实测：删除本地全部标签
# 后纯 digest 拉取成功）；极端情况 digest 失效（上游删库重建）时 pull_image 自动回退
# latest 标签链，安装不失败。
# 置空 = 跟随 latest（旧行为，不推荐）。环境变量 ANDROIDEMU_WEBRTC_DIGEST 可临时覆盖。
WEBRTC_DIGEST="${ANDROIDEMU_WEBRTC_DIGEST:-sha256:dc6e62393e0e490c79410d8b41ef32896f7a384b97077e4b5cfb9804a4bb2cdd}"
WEBRTC_REPO="${ANDROIDEMU_WEBRTC_REPO:-buutuu/scrcpy-over-webrtc}"
WEBRTC_TAG="${ANDROIDEMU_WEBRTC_TAG:-latest}"

# ── 加速源前缀（实测 fnOS 的 registry-mirrors 对官方名不生效，故直接用前缀名拉取）──
ACCEL_PREFIX="${ANDROIDEMU_ACCEL_PREFIX:-docker.fnnas.com}"

# ── 升级缓存 tag 前缀（飞牛升级按官方名清理镜像，缓存 tag 可存活，用于秒级恢复）──
CACHE_PREFIX="${ANDROIDEMU_CACHE_PREFIX:-androidemu-cache}"

# ── GMS 文件载体镜像（按架构分标签：:x86_64 / :arm64；仅用户选择装 GMS 时才拉）──
GMS_IMAGE_BASE="${GMS_IMAGE_BASE:-ghcr.io/lin1740/androidemu-gms}"

# ── 派生值（脚本直接使用，勿在此处手改；改上面几项即可）──
CANON_REDROID="${ACCEL_PREFIX}/${REDROID_REPO}:${REDROID_TAG}"
OFF_REDROID="${REDROID_REPO}:${REDROID_TAG}"
CANON_WEBRTC="${ACCEL_PREFIX}/${WEBRTC_REPO}:${WEBRTC_TAG}"
OFF_WEBRTC="${WEBRTC_REPO}:${WEBRTC_TAG}"
### digest 锁定引用（WEBRTC_DIGEST 非空时 compose/拉取用它，内容不可变）；
### CANON/OFF 保留 tag 形式，专供 docker tag（tag 目标不允许带 @digest）与缓存命名
if [ -n "${WEBRTC_DIGEST:-}" ]; then
    CANON_WEBRTC_REF="${CANON_WEBRTC%:*}@${WEBRTC_DIGEST}"
    OFF_WEBRTC_REF="${OFF_WEBRTC%:*}@${WEBRTC_DIGEST}"
else
    CANON_WEBRTC_REF="$CANON_WEBRTC"
    OFF_WEBRTC_REF="$OFF_WEBRTC"
fi
CACHE_REDROID="${CACHE_PREFIX}/redroid:${ANDROID_VER}"
CACHE_WEBRTC="${CACHE_PREFIX}/webrtc:${WEBRTC_TAG}"
